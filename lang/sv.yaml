# Swedish language pack. Translations are ours, written for this repository.
# They have not been reviewed by a native speaker. Erik's review is pending.
# No Clinergy text: the keys are concept names, the words are our Swedish.
id: sv
subJoiner: av
locationOrder: sub-lat-loc
# An adverb is the neuter adjective (svår -> svårt) when no adverb is listed.
adverbRule: suffix-t
prepositions:
  in: i
  of: av
  on: på
definiteness:
  topic: false
  location: false
  subLocation: false
laterality:
  left:
    adjective: vänster
    adjectiveForms:
      en: vänster
      ett: vänster
      plural: vänstra
      definite: vänstra
  right:
    adjective: höger
    adjectiveForms:
      en: höger
      ett: höger
      plural: högra
      definite: högra
