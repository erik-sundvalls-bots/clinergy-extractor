# Synthetic concepts for the thumb-pain tests. Not extracted from Clinergy.
# Displays are ordinary English words, the same ones the public walkthrough
# shows on the buttons and in the summary box. Keys follow this repo's
# synthetic naming (see tests/fixtures/dumps/entities.tsv: ElbowAcheSymptom,
# display "elbow ache") and the real topic name ThumbPainSymptom.
# Other keys (Thumb, DistalPhalanx, presence, ...) are ours. The real model
# may spell them differently; the env-gated test uses whatever CLINERGY_OUT has.
ThumbPainSymptom:
  id: 1
  display: thumb pain
  category: Complete symptom
  summaryType: AbsentPresent
  supers:
    - PainSymptom
PainSymptom:
  id: 2
  display: pain
  category: Incomplete symptom
  summaryType: AbsentPresent
  supers: []
ThumbSwellingSymptom:
